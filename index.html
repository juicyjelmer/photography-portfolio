<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jelmer Bontje</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off: #f5f5f3;
      --ink: #111110;
      --muted: #888884;
      --border: #e8e8e5;
      --tab-h: 40px;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--white);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px 0;
    }

    .site-name {
      display: block;
      line-height: 0;
    }

    .site-name img {
      height: 48px;
      width: auto;
      display: block;
    }

    .header-links {
      display: flex;
      gap: 20px;
    }

    .header-links a {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .header-links a:hover { color: var(--ink); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0;
      padding: 28px 20px 0;
      border-bottom: 1px solid var(--border);
      margin-top: 4px;
    }

    .tab {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0 0 12px;
      margin-right: 28px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
      margin-bottom: -1px;
    }

    .tab.active {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .tab:hover:not(.active) { color: var(--ink); }

    /* ── Grid ── */
    .gallery {
      padding: 12px;
      columns: 2;
      column-gap: 12px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 12px;
      display: block;
      overflow: hidden;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .gallery-item img.loaded { opacity: 1; }
    .gallery-item:hover img.loaded { opacity: 0.88; }

    /* hidden panel */
    .panel { display: none; opacity: 0; transition: opacity 0.4s ease; }
    .panel.active { display: block; }
    .panel.active.fade-in { opacity: 1; }

    /* ── Collection view ── */
    .collection-header {
      padding: 24px 20px 4px;
    }

    .back-link {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-bottom: 20px;
      transition: color 0.15s ease;
    }

    .back-link:hover { color: var(--ink); }

    .collection-title {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .collection-description {
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 640px;
      margin-bottom: 8px;
    }

    .gallery-item.clickable { cursor: pointer; }
    .gallery-item.zoomable { cursor: zoom-in; }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 16, 0.94);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox.active { display: flex; }
    .lightbox.active.fade-in { opacity: 1; }

    .lightbox img {
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: fixed;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--off);
      background: none;
      border: none;
      cursor: pointer;
      padding: 12px;
      transition: color 0.15s ease;
    }

    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover { color: var(--white); }

    .lightbox-close { top: 16px; right: 16px; font-size: 20px; }
    .lightbox-prev { left: 8px; top: 50%; transform: translateY(-50%); font-size: 28px; }
    .lightbox-next { right: 8px; top: 50%; transform: translateY(-50%); font-size: 28px; }

    @media (min-width: 768px) {
      .lightbox-close { top: 28px; right: 32px; }
      .lightbox-prev { left: 20px; }
      .lightbox-next { right: 20px; }
    }

    /* ── Footer ── */
    footer {
      padding: 40px 20px 32px;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }

    footer p {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Desktop ── */
    @media (min-width: 768px) {
      header { padding: 36px 40px 0; }
      .site-name img { height: 48px; }
      .tabs { padding: 32px 40px 0; }
      .gallery { columns: 3; padding: 16px; column-gap: 16px; }
      .gallery-item { margin-bottom: 16px; }
      .collection-header { padding: 32px 40px 4px; }
      footer { padding: 48px 40px 36px; }
    }

    @media (min-width: 1200px) {
      .gallery { columns: 4; }
    }
  </style>
</head>
<body>

  <header>
    <a class="site-name" href="index.html"><img src="content/Menu/namecard.jpg" alt="Jelmer Bontje" /></a>
    <nav class="header-links">
      <a href="about.html">About</a>
      <a href="about.html#contact">Contact</a>
    </nav>
  </header>

  <nav class="tabs">
    <button class="tab active" data-panel="artistic">Artistic work</button>
    <button class="tab" data-panel="corporate">Corporate work</button>
  </nav>

  <div class="panel active fade-in" id="panel-artistic">
    <div class="gallery" id="gallery-artistic"></div>
  </div>

  <div class="panel" id="panel-corporate">
    <div class="gallery" id="gallery-corporate"></div>
  </div>

  <div class="panel" id="panel-collection">
    <div class="collection-header">
      <button class="back-link" id="collection-back">&larr; Back</button>
      <h1 class="collection-title" id="collection-title"></h1>
      <p class="collection-description" id="collection-description"></p>
    </div>
    <div class="gallery" id="gallery-collection"></div>
  </div>

  <footer>
    <p>&copy; 2026 Jelmer Bontje — Photography</p>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <button class="lightbox-prev" id="lightbox-prev">&lsaquo;</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox-next" id="lightbox-next">&rsaquo;</button>
  </div>

  <script>
    const PLACEHOLDERS = {
      artistic: [
        ['600x800','e8e8e5'],['600x400','d8d8d5'],['600x750','e0e0dd'],
        ['600x500','d0d0cd'],['600x900','e4e4e1'],['600x600','dcdcd9'],
        ['600x450','e8e8e5'],['600x700','d8d8d5'],['600x550','e0e0dd'],['600x800','d4d4d1']
      ],
      corporate: [
        ['600x600','e4e4e1'],['600x900','dcdcd9'],['600x500','e8e8e5'],
        ['600x750','d8d8d5'],['600x650','e0e0dd'],['600x800','d4d4d1']
      ]
    }

    async function loadGallery(category) {
      const gallery = document.getElementById('gallery-' + category)
      let featured = []
      let loose = []

      try {
        const res = await fetch(`/content/${category}/data.json`)
        ;({ featured, loose } = await res.json())
      } catch {}

      if (featured.length === 0 && loose.length === 0) {
        loose = PLACEHOLDERS[category].map(([size, color]) =>
          `https://placehold.co/${size}/${color}/888884?text=.`
        )
      }

      const featuredHtml = featured.map(({ src, collection }) =>
        `<div class="gallery-item clickable" data-category="${category}" data-collection="${collection}"><img src="${src}" alt="" loading="lazy" onload="this.classList.add('loaded')" /></div>`
      ).join('')

      const looseHtml = loose.map(src =>
        `<div class="gallery-item zoomable"><img src="${src}" alt="" loading="lazy" onload="this.classList.add('loaded')" /></div>`
      ).join('')

      gallery.innerHTML = featuredHtml + looseHtml

      gallery.querySelectorAll('.gallery-item.clickable').forEach(item => {
        item.addEventListener('click', () => openCollection(item.dataset.category, item.dataset.collection))
      })
      gallery.querySelectorAll('img').forEach(img => { if (img.complete) img.classList.add('loaded') })
      wireLightbox(gallery)
    }

    loadGallery('artistic')
    loadGallery('corporate')

    const tabs = document.querySelectorAll('.tab')
    const tabsNav = document.querySelector('.tabs')
    const panels = document.querySelectorAll('.panel')
    let lastTabPanel = 'artistic'

    function showPanel(name) {
      panels.forEach(p => p.classList.remove('active', 'fade-in'))
      const panel = document.getElementById('panel-' + name)
      panel.classList.add('active')
      requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add('fade-in')))
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'))
        tab.classList.add('active')
        lastTabPanel = tab.dataset.panel
        tabsNav.style.display = ''
        showPanel(lastTabPanel)
      })
    })

    async function openCollection(category, slug) {
      const gallery = document.getElementById('gallery-collection')
      const titleEl = document.getElementById('collection-title')
      const descEl = document.getElementById('collection-description')

      let data = { title: slug, description: '', images: [] }
      try {
        const res = await fetch(`/content/${category}/${encodeURIComponent(slug)}/data.json`)
        data = await res.json()
      } catch {}

      titleEl.textContent = data.title
      descEl.textContent = data.description || ''
      descEl.style.display = data.description ? '' : 'none'
      gallery.innerHTML = data.images.map(src =>
        `<div class="gallery-item zoomable"><img src="${src}" alt="" loading="lazy" onload="this.classList.add('loaded')" /></div>`
      ).join('')
      gallery.querySelectorAll('img').forEach(img => { if (img.complete) img.classList.add('loaded') })
      wireLightbox(gallery)

      tabsNav.style.display = 'none'
      showPanel('collection')
      window.scrollTo(0, 0)
    }

    document.getElementById('collection-back').addEventListener('click', () => {
      tabsNav.style.display = ''
      showPanel(lastTabPanel)
    })

    // ── Lightbox ──
    const lightbox = document.getElementById('lightbox')
    const lightboxImg = document.getElementById('lightbox-img')
    let lightboxSrcs = []
    let lightboxIndex = 0

    function wireLightbox(gallery) {
      gallery.querySelectorAll('.gallery-item.zoomable').forEach((item, i, items) => {
        item.addEventListener('click', () => {
          lightboxSrcs = [...items].map(el => el.querySelector('img').src)
          openLightbox(i)
        })
      })
    }

    function openLightbox(index) {
      lightboxIndex = index
      lightboxImg.src = lightboxSrcs[lightboxIndex]
      lightbox.classList.add('active')
      requestAnimationFrame(() => requestAnimationFrame(() => lightbox.classList.add('fade-in')))
      document.body.style.overflow = 'hidden'
      const showNav = lightboxSrcs.length > 1
      document.getElementById('lightbox-prev').style.display = showNav ? '' : 'none'
      document.getElementById('lightbox-next').style.display = showNav ? '' : 'none'
    }

    function closeLightbox() {
      lightbox.classList.remove('active', 'fade-in')
      document.body.style.overflow = ''
    }

    function showLightboxOffset(offset) {
      lightboxIndex = (lightboxIndex + offset + lightboxSrcs.length) % lightboxSrcs.length
      lightboxImg.src = lightboxSrcs[lightboxIndex]
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox)
    document.getElementById('lightbox-prev').addEventListener('click', () => showLightboxOffset(-1))
    document.getElementById('lightbox-next').addEventListener('click', () => showLightboxOffset(1))

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox()
    })

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return
      if (e.key === 'Escape') closeLightbox()
      if (e.key === 'ArrowLeft') showLightboxOffset(-1)
      if (e.key === 'ArrowRight') showLightboxOffset(1)
    })
  </script>

</body>
</html>
